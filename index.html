<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>ひよこブラスター</title>
<style>
:root{--ink:#eaf6ff;--acc:#7ef9ff;--acc2:#ff5fb2;--warn:#ffd166;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{height:100%;margin:0;background:#02030a;overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;}
#wrap{position:relative;width:100%;height:100%;height:100dvh;display:flex;align-items:center;justify-content:center;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
#stage{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;}
canvas{display:block;width:100%;height:100%;background:#02030a;}
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;color:var(--ink);
  font-size:15px;letter-spacing:.03em;text-shadow:0 0 6px rgba(126,249,255,.6);pointer-events:none;}
#lives span{color:var(--acc2);text-shadow:0 0 6px rgba(255,95,178,.8);margin-left:2px;}
#bossbar{position:absolute;top:34px;left:12px;right:12px;height:8px;border:1px solid rgba(255,209,102,.6);
  border-radius:4px;overflow:hidden;display:none;background:rgba(255,255,255,.06)}
#bossbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5fb2,#ffd166);}
#msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  color:var(--ink);text-align:center;gap:10px;background:rgba(2,3,10,.72);z-index:50;}
#msg h1{margin:0;font-size:26px;letter-spacing:.05em;color:var(--warn);text-shadow:0 0 10px rgba(255,209,102,.7)}
#msg p{margin:0;font-size:15px;opacity:.85}
#msg .hint{font-size:12px;opacity:.6;margin-top:2px}
#msgRestart{margin-top:10px;padding:10px 30px;border-radius:10px;border:1px solid var(--warn);color:var(--warn);
  background:rgba(255,209,102,.12);font-size:15px;letter-spacing:.05em;}
#touch{position:absolute;inset:0;display:flex;}
.zone{flex:1;position:relative;touch-action:none;}
.hintring{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
  pointer-events:none;}
#padHint{left:50%;bottom:70px;transform:translateX(-50%);width:76px;height:76px;
  border:2px solid rgba(126,249,255,.35);color:rgba(126,249,255,.5);font-size:24px;}
#btnBomb{position:absolute;right:56px;bottom:80px;width:84px;height:84px;border-radius:50%;
  border:2px solid rgba(255,232,120,.85);background:rgba(255,232,120,.15);color:#ffe878;
  font-size:14px;font-weight:bold;letter-spacing:.03em;z-index:5;}
#btnBomb:disabled{opacity:.3;}
#flashOverlay{position:fixed;inset:0;background:rgba(255,244,168,.55);display:none;pointer-events:none;z-index:200;}
#joyBase{position:fixed;width:90px;height:90px;margin-left:-45px;margin-top:-45px;border-radius:50%;
  border:2px solid rgba(126,249,255,.5);background:rgba(126,249,255,.08);display:none;pointer-events:none;z-index:40;}
#joyKnob{position:fixed;width:42px;height:42px;margin-left:-21px;margin-top:-21px;border-radius:50%;
  background:rgba(126,249,255,.4);border:1px solid rgba(126,249,255,.8);display:none;pointer-events:none;z-index:41;}
@media (min-width:820px){#touch{display:none}}
#rotate{display:none;position:fixed;inset:0;z-index:9999;background:#02030a;color:var(--ink);
  align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:24px;}
#rotate .ic{font-size:40px;}
@media (orientation:landscape) and (pointer:coarse){#rotate{display:flex;}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="cv"></canvas>
<div id="hud"><div id="score">SCORE 0</div><div><div id="lives">LIFE <span>●</span><span>●</span><span>●</span></div><div id="bombhud" style="text-align:right;font-size:12px;opacity:.8;margin-top:2px;">BOMB <span id="bombDot"></span></div></div></div>
<div id="bossbar"><i></i></div>
<div id="msg"><h1 id="msgTitle"></h1><p id="msgSub"></p><p class="hint" id="msgHint"></p><button id="msgRestart">もう一度あそぶ</button></div>
<div id="touch">
  <div id="padZone" class="zone"><div id="padHint" class="hintring">⊕</div></div>
  <div id="fireZone" class="zone"><button id="btnBomb">BOMB</button></div>
</div>
<div id="joyBase"></div><div id="joyKnob"></div>
</div></div>
<div id="flashOverlay"></div>
<div id="rotate"><div class="ic">🐥📱</div><p>スマホを縦向きに持ち替えてください</p></div>

const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives');
const btnBomb=document.getElementById('btnBomb'),flashOverlay=document.getElementById('flashOverlay'),bombDot=document.getElementById('bombDot');
function useBomb(){
  if(state!=='playing'||bombs<=0)return;
  bombs--;if(bombs<=0)btnBomb.disabled=true;
  ebullets=[];
  flashT=36;
}
btnBomb.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();useBomb();},{passive:false});
btnBomb.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();useBomb();});
const msg=document.getElementById('msg'),msgT=document.getElementById('msgTitle'),msgS=document.getElementById('msgSub'),msgH=document.getElementById('msgHint');
const bossbar=document.getElementById('bossbar'),bossbarI=bossbar.firstElementChild;
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if((e.key==='r'||e.key==='R')&&(state==='gameover'||state==='clear'))restart();if(e.key==='e'||e.key==='E')useBomb();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const padZone=document.getElementById('padZone'),fireZone=document.getElementById('fireZone');
const joyBase=document.getElementById('joyBase'),joyKnob=document.getElementById('joyKnob');
let padTouchId=null,padOX=0,padOY=0,padDir={x:0,y:0},padMag=0;
const JOY_MAX=42,JOY_DEAD=6;
function padUpdate(cx,cy){let dx=cx-padOX,dy=cy-padOY;const len=Math.hypot(dx,dy);
  if(len<JOY_DEAD){padDir.x=0;padDir.y=0;padMag=0;joyKnob.style.left=padOX+'px';joyKnob.style.top=padOY+'px';return;}
  const clamped=Math.min(len,JOY_MAX);const nx=dx/len,ny=dy/len;
  padDir.x=nx;padDir.y=ny;padMag=clamped/JOY_MAX;
  joyKnob.style.left=(padOX+nx*clamped)+'px';joyKnob.style.top=(padOY+ny*clamped)+'px';}
function padStart(cx,cy,id){padTouchId=id;padOX=cx;padOY=cy;
  joyBase.style.left=cx+'px';joyBase.style.top=cy+'px';joyBase.style.display='block';
  joyKnob.style.left=cx+'px';joyKnob.style.top=cy+'px';joyKnob.style.display='block';}
function padEnd(){padTouchId=null;padDir.x=0;padDir.y=0;padMag=0;joyBase.style.display='none';joyKnob.style.display='none';}
padZone.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){if(padTouchId===null)padStart(t.clientX,t.clientY,t.identifier);}},{passive:false});
padZone.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier===padTouchId)padUpdate(t.clientX,t.clientY);}},{passive:false});
padZone.addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier===padTouchId)padEnd();}});
padZone.addEventListener('touchcancel',e=>{for(const t of e.changedTouches){if(t.identifier===padTouchId)padEnd();}});
padZone.addEventListener('mousedown',e=>{padStart(e.clientX,e.clientY,'mouse');});
addEventListener('mousemove',e=>{if(padTouchId==='mouse')padUpdate(e.clientX,e.clientY);});
addEventListener('mouseup',()=>{if(padTouchId==='mouse')padEnd();});
document.getElementById('msgRestart').addEventListener('click',()=>{if(state==='gameover'||state==='clear')restart();});
function rand(a,b){return a+Math.random()*(b-a);}
function dist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2);}

let stars=[];for(let i=0;i<70;i++)stars.push({x:rand(0,W),y:rand(0,H),r:rand(.5,1.8),s:rand(.6,2.2)});

let player,pbullets,ebullets,enemies,frame,score,lives,invT,state,bossFightDone,curFocus=false,explosions=[],playerDead=false,bombs=3,flashT=0;
function initGame(){
  player={x:W/2,y:H-90,r:6,shootT:0};
  pbullets=[];ebullets=[];enemies=[];frame=0;score=0;lives=3;invT=0;state='playing';bossFightDone=false;explosions=[];playerDead=false;bombs=3;flashT=0;
  btnBomb.disabled=false;flashOverlay.style.display='none';
  bossbar.style.display='none';msg.style.display='none';
  updateHud();
}
function updateHud(){scoreEl.textContent='SCORE '+score;
  livesEl.innerHTML='LIFE '+'<span>●</span>'.repeat(Math.max(lives,0));
  bombDot.innerHTML='●'.repeat(Math.max(bombs,0));}
function restart(){initGame();}

function spawnNormal(){enemies.push({type:'normal',x:rand(30,W-30),y:-20,hp:4,vy:1.1,r:13,shootT:rand(61,121)});}
function spawnElite(){enemies.push({type:'elite',x:rand(50,W-50),y:-24,hp:12,vy:.7,r:17,shootT:70});}
function spawnFormation(){const cx=W/2;
  for(let i=0;i<5;i++){const off=(i-2)*38;
    enemies.push({type:'formation',x:cx+off,y:-30-Math.abs(off)*.6,homeY:130,hp:4,vy:1.4,r:11,shootT:rand(91,182),t:0});}}
function spawnBoss(){enemies.push({type:'boss',x:W/2,y:-70,hp:270,maxHp:270,r:42,phase:0,phaseT:0,vy:.6,dying:false,dyingT:0});}

function spawnExplosion(x,y,scale,life){
  const sparks=[];for(let i=0;i<10;i++)sparks.push({a:rand(0,Math.PI*2),s:rand(1.2,3.2)*scale});
  explosions.push({x,y,age:0,life:life||24,scale:scale||1,sparks});
}

function firePlayerBullet(){pbullets.push({x:player.x-8,y:player.y-10,vy:-7});pbullets.push({x:player.x+8,y:player.y-10,vy:-7});}
function fireAimed(e,speed){const a=Math.atan2(player.y-e.y,player.x-e.x);
  ebullets.push({x:e.x,y:e.y,vx:Math.cos(a-.09)*speed,vy:Math.sin(a-.09)*speed,r:4,c:'#ff5fb2'});
  ebullets.push({x:e.x,y:e.y,vx:Math.cos(a+.09)*speed,vy:Math.sin(a+.09)*speed,r:4,c:'#ff5fb2'});}
function fireRadial(e,n,speed){for(let i=0;i<n;i++){const a=i/n*Math.PI*2;
  ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:4,c:'#7ef9ff'});}}
function fireSpiral(e,speed){e._sp=(e._sp||0)+0.5;
  for(let k=0;k<8;k++){const a=e._sp+k*Math.PI/4;
    ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:4,c:'#ffd166'});}}

function update(){
  frame++;
  for(const s of stars){s.y+=s.s;if(s.y>H){s.y=0;s.x=rand(0,W);}}
  if(flashT>0){flashT--;const elapsed=36-flashT;
    flashOverlay.style.display=(Math.floor(elapsed/6)%2===0)?'block':'none';
  } else flashOverlay.style.display='none';
  if(state!=='playing')return;
  let dx=0,dy=0;
  if(keys['arrowleft']||keys['a'])dx-=1;
  if(keys['arrowright']||keys['d'])dx+=1;
  if(keys['arrowup']||keys['w'])dy-=1;
  if(keys['arrowdown']||keys['s'])dy+=1;
  let spd=0,touchFocus=false;
  if(dx||dy){if(dx&&dy){dx*=0.7071;dy*=0.7071;}spd=keys['shift']?2.1:4.2;}
  else if(padMag>0){dx=padDir.x;dy=padDir.y;spd=2.1+(4.2-2.1)*padMag;touchFocus=padMag<0.55;}
  const focus=!!keys['shift']||touchFocus;
  curFocus=focus;
  player.x=Math.min(W-18,Math.max(18,player.x+dx*spd));
  player.y=Math.min(H-24,Math.max(24,player.y+dy*spd));
  player.shootT--;
  if(player.shootT<=0){firePlayerBullet();player.shootT=7;}
  if(invT>0)invT--;

  if(!bossFightDone){
    if(frame<2160){
      const interval=Math.max(38,80-frame/27);
      if(frame%Math.floor(interval)===0)spawnNormal();
      if(frame>540&&frame%260===0)spawnElite();
      if(frame>900&&frame%690===0)spawnFormation();
    } else if(!enemies.some(e=>e.type==='boss')){
      spawnBoss();bossbar.style.display='block';
    }
  }

  for(const e of enemies){
    if(e.type==='normal'){e.y+=e.vy;e.shootT--;if(e.shootT<=0&&e.y>0){fireAimed(e,2.6);e.shootT=rand(83,144);}}
    else if(e.type==='elite'){e.y+=e.vy;e.shootT--;if(e.shootT<=0&&e.y>0){fireRadial(e,20,2.2);e.shootT=rand(85,130);}}
    else if(e.type==='formation'){e.t++;
      if(e.y<e.homeY)e.y+=e.vy;else e.x+=Math.sin((frame+e.t)/28)*1.1;
      e.shootT--;if(e.shootT<=0&&e.y>10){fireAimed(e,2.8);e.shootT=rand(106,167);}
      if(e.t>420)e.y+=2.4;}
    else if(e.type==='boss'){
      if(e.dying){
        e.dyingT++;
        if(e.dyingT%14===0)spawnExplosion(e.x+rand(-46,46),e.y+rand(-40,40),rand(1,1.6),28);
        if(e.dyingT>=300){spawnExplosion(e.x,e.y,2.2,40);e.dying=false;endGame(true);}
      } else if(e.y<100)e.y+=e.vy;else{
        e.x=W/2+Math.sin(frame/70)*90;e.phaseT++;
        const ph=Math.floor(frame/240)%3;
        if(ph===0&&e.phaseT%26===0)fireAimed(e,3.0);
        else if(ph===0&&e.phaseT%26===13){fireAimed({x:e.x-14,y:e.y},3.0);fireAimed({x:e.x+14,y:e.y},3.0);}
        if(ph===1&&e.phaseT%10===0)fireSpiral(e,2.4);
        if(ph===2&&e.phaseT%27===0)fireRadial(e,28,2.0);
      }
      if(e.hp<=e.maxHp)bossbarI.style.width=Math.max(0,e.hp/e.maxHp*100)+'%';
    }
  }
  enemies=enemies.filter(e=>e.y<H+60&&(e.hp>0||e.dying));

  for(const b of pbullets)b.y+=b.vy;
  pbullets=pbullets.filter(b=>b.y>-20);
  for(const b of ebullets){b.x+=b.vx;b.y+=b.vy;}
  ebullets=ebullets.filter(b=>b.x>-10&&b.x<W+10&&b.y>-10&&b.y<H+10);

  for(const e of enemies){
    for(const b of pbullets){
      if(dist(b.x,b.y,e.x,e.y)<e.r){e.hp--;b.hit=true;
        if(e.hp<=0&&!e.dead){e.dead=true;
          score+=e.type==='boss'?5000:e.type==='elite'?300:e.type==='formation'?150:100;
          if(e.type==='boss'){e.dying=true;e.dyingT=0;}
          else{spawnExplosion(e.x,e.y,1,22);}
        }}
    }
  }
  pbullets=pbullets.filter(b=>!b.hit);
  for(const ex of explosions)ex.age++;
  explosions=explosions.filter(ex=>ex.age<=ex.life);

  if(invT<=0){
    for(const b of ebullets){
      if(dist(b.x,b.y,player.x,player.y)<player.r+2){onHit();b.hit=true;break;}
    }
    for(const e of enemies){
      if(dist(e.x,e.y,player.x,player.y)<e.r+player.r){onHit();if(e.type!=='boss'){e.hp=0;if(!e.dead){e.dead=true;spawnExplosion(e.x,e.y,1,22);}}break;}
    }
  }
  ebullets=ebullets.filter(b=>!b.hit);
  updateHud();
}
function onHit(){
  lives--;invT=100;
  ebullets=ebullets.filter(b=>dist(b.x,b.y,player.x,player.y)>90);
  if(lives<=0){spawnExplosion(player.x,player.y,1.4,30);playerDead=true;endGame(false);}
}
function endGame(clear){
  state=clear?'clear':'gameover';
  msg.style.display='flex';
  msgT.textContent=clear?'STAGE CLEAR!':'GAME OVER';
  msgS.textContent='SCORE '+score;
  msgH.textContent='Rキー / RESTARTボタンでもう一度';
}

function drawChick(x,y,invis,focus){
  ctx.save();
  if(invis&&frame%10<5)ctx.globalAlpha=.35;
  const w=36,h=36;
  if(playerImgReady)ctx.drawImage(playerImg,x-w/2,y-h/2,w,h);
  else{ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.fill();}
  ctx.fillStyle=focus?'#ff5fb2':'rgba(255,95,178,.55)';
  ctx.shadowColor='#ff5fb2';ctx.shadowBlur=focus?10:3;
  ctx.beginPath();ctx.arc(x,y+4,focus?3:2,0,7);ctx.fill();ctx.shadowBlur=0;
  ctx.restore();
}
function drawBoss(x,y){
  ctx.save();
  const w=108,h=95;
  if(bossImgReady)ctx.drawImage(bossImg,x-w/2,y-h/2,w,h);
  else{ctx.fillStyle='#ffd166';ctx.beginPath();ctx.ellipse(x,y,30,26,0,0,7);ctx.fill();}
  ctx.restore();
}
function drawNormal(r){
  const h=r*2.6,w=h*(65/110);
  if(normalImgReady)ctx.drawImage(normalImg,-w/2,-h/2,w,h);
  else{ctx.fillStyle='#f3ecec';ctx.beginPath();ctx.ellipse(0,0,r*.8,r,0,0,7);ctx.fill();}
}
function drawClam(r){
  const w=r*2.1,h=w*(110/99);
  if(clamImgReady)ctx.drawImage(clamImg,-w/2,-h/2,w,h);
  else{ctx.fillStyle='#e8d9b0';ctx.beginPath();ctx.moveTo(-r,0);ctx.quadraticCurveTo(0,-r*1.1,r,0);ctx.quadraticCurveTo(0,r*1.1,-r,0);ctx.fill();}
}
function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);
  if(e.type==='elite')drawClam(e.r);else drawNormal(e.r);
  ctx.restore();
}
function drawExplosions(){
  for(const ex of explosions){
    const p=ex.age/ex.life,alpha=Math.max(0,1-p);
    const rad=(6+34*p)*ex.scale;
    const grad=ctx.createRadialGradient(ex.x,ex.y,0,ex.x,ex.y,Math.max(1,rad));
    grad.addColorStop(0,`rgba(255,255,255,${alpha})`);
    grad.addColorStop(.4,`rgba(255,209,102,${alpha*.85})`);
    grad.addColorStop(1,'rgba(255,95,178,0)');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(ex.x,ex.y,Math.max(1,rad),0,7);ctx.fill();
    for(const sp of ex.sparks){
      const d=sp.s*ex.age;
      ctx.fillStyle=`rgba(255,190,110,${alpha})`;
      ctx.beginPath();ctx.arc(ex.x+Math.cos(sp.a)*d,ex.y+Math.sin(sp.a)*d,Math.max(.5,2.4*ex.scale*alpha),0,7);ctx.fill();
    }
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#050414');g.addColorStop(1,'#02030a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#cfefff';
  for(const s of stars){ctx.globalAlpha=.5+s.r/2;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  for(const b of pbullets){ctx.fillStyle='#7ef9ff';ctx.shadowColor='#7ef9ff';ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(b.x,b.y,3,0,7);ctx.fill();ctx.shadowBlur=0;}
  for(const e of enemies){if(e.type==='boss')drawBoss(e.x,e.y);else drawEnemy(e);}
  for(const b of ebullets){ctx.fillStyle=b.c;ctx.shadowColor=b.c;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.shadowBlur=0;}
  if((state==='playing'||invT>0)&&!playerDead)drawChick(player.x,player.y,invT>0,curFocus);
  drawExplosions();
}
function loop(){update();draw();requestAnimationFrame(loop);}
initGame();loop();
</script>
